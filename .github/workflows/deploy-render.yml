# Render : déclenchement automatique désactivé — production WS sur Hetzner uniquement.
# Réactiver un déploiement Render manuellement : onglet Actions → ce workflow → Run workflow.
name: Deploy to Render (manuel uniquement)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL non défini"
            exit 1
          fi
          echo "🚀 Déclenchement manuel du déploiement Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "✅ Demande envoyée à Render."
